<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add account</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{waterCSSURL}}">
<link rel="stylesheet" href="{{dashboardAssetURL "accounts.css"}}">
</head>
<body>
<main>
<h1>Add an account</h1>
<p class="lead">Open Claude sign-in, authorize this balancer, then return here.</p>
{{if .UserCode}}<button class="code" type="button" data-copy-code="{{.UserCode}}">
<span>{{.UserCode}}</span>
<small>Click to copy</small>
</button>{{end}}
<a class="sign-in" href="{{.VerificationURL}}" target="_blank" rel="noreferrer">Open sign-in</a>
<p class="lead">If sign-in sends your browser to a localhost callback, copy that full address and paste it below.</p>
<form class="callback" action="/accounts/callback" method="post">
<label for="callback-url">Callback address</label>
<input id="callback-url" name="callback_url" type="url" inputmode="url" autocomplete="off" spellcheck="false" required>
<button class="sign-in" type="submit">Complete sign-in</button>
</form>
</main>
<script src="{{dashboardAssetURL "accounts.js"}}"></script>
</body>
</html>
